# Apply this to a namespace to verify admission is rejected.
# Kyverno ClusterPolicy should block: privileged=true, runAsNonRoot=false, allowPrivilegeEscalation=true.
apiVersion: v1
kind: Pod
metadata:
  name: privileged-test
  # namespace: replace with your target namespace
spec:
  containers:
    - name: privileged-test
      image: container-scenarios/privileged-rejected:latest
      securityContext:
        privileged: true
        runAsNonRoot: false
        runAsUser: 0
        allowPrivilegeEscalation: true
